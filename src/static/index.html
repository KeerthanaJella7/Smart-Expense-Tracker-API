<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Expense Tracker - Analytics Dashboard</title>
  <meta name="description" content="Production-ready Smart Expense Tracker web application powered by Python FastAPI and Pydantic.">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="app-container">
    <!-- Navbar -->
    <header class="navbar">
      <div class="brand">
        <div class="brand-icon">
          <i class="fa-solid fa-wallet"></i>
        </div>
        <div class="brand-title">Smart Expense Tracker</div>
      </div>
      <div class="nav-actions">
        <a href="/docs" target="_blank" class="btn-docs">
          <i class="fa-solid fa-code"></i> API Docs
        </a>
        <button id="btn-open-modal" class="btn-primary">
          <i class="fa-solid fa-plus"></i> Add Expense
        </button>
      </div>
    </header>

    <!-- Analytics Stats Overview -->
    <section class="stats-grid">
      <div class="stat-card stat-total">
        <div class="stat-header">
          <span class="stat-label">Total Expenditure</span>
          <i class="fa-solid fa-coins stat-icon" style="color: var(--accent-cyan);"></i>
        </div>
        <div id="stat-total-value" class="stat-value">$0.00</div>
      </div>

      <div class="stat-card stat-count">
        <div class="stat-header">
          <span class="stat-label">Total Expenses</span>
          <i class="fa-solid fa-receipt stat-icon" style="color: var(--accent-emerald);"></i>
        </div>
        <div id="stat-count-value" class="stat-value">0</div>
      </div>

      <div class="stat-card stat-top">
        <div class="stat-header">
          <span class="stat-label">Top Category</span>
          <i class="fa-solid fa-chart-pie stat-icon" style="color: var(--accent-amber);"></i>
        </div>
        <div id="stat-top-value" class="stat-value">N/A</div>
      </div>

      <div class="stat-card stat-avg">
        <div class="stat-header">
          <span class="stat-label">Average Expense</span>
          <i class="fa-solid fa-calculator stat-icon" style="color: var(--primary);"></i>
        </div>
        <div id="stat-avg-value" class="stat-value">$0.00</div>
      </div>
    </section>

    <!-- Filter & Search Toolbar -->
    <section class="toolbar">
      <div class="toolbar-top">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="search-input" class="input-search" placeholder="Search expenses by title...">
        </div>
        <select id="sort-select" class="sort-select">
          <option value="date-desc">Newest First</option>
          <option value="date-asc">Oldest First</option>
          <option value="amount-desc">Amount: High to Low</option>
          <option value="amount-asc">Amount: Low to High</option>
        </select>
      </div>

      <div class="category-pills" id="category-pills">
        <button class="pill active" data-category="">All Categories</button>
        <button class="pill" data-category="Food">🍔 Food</button>
        <button class="pill" data-category="Transport">🚗 Transport</button>
        <button class="pill" data-category="Utilities">💡 Utilities</button>
        <button class="pill" data-category="Entertainment">🎬 Entertainment</button>
        <button class="pill" data-category="Health">🏥 Health</button>
        <button class="pill" data-category="Shopping">🛍️ Shopping</button>
        <button class="pill" data-category="Other">📦 Other</button>
      </div>
    </section>

    <!-- Dashboard Content Grid -->
    <main class="dashboard-grid">
      <!-- Left Column: Expense Cards -->
      <section class="expense-section">
        <div class="section-header">
          <h2 class="section-title">Recent Transactions</h2>
          <span id="results-count" style="color: var(--text-muted); font-size: 0.85rem;">0 items</span>
        </div>

        <div id="expense-list" class="expense-list">
          <!-- Dynamically populated -->
        </div>
      </section>

      <!-- Right Column: Analytics Sidebar -->
      <aside class="sidebar-panel">
        <h3 class="section-title"><i class="fa-solid fa-chart-bar" style="color: var(--primary);"></i> Category Breakdown</h3>
        <div id="category-breakdown-list" style="display: flex; flex-direction: column; gap: 1rem;">
          <!-- Dynamically populated -->
        </div>
      </aside>
    </main>
  </div>

  <!-- Add Expense Modal -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">New Expense Entry</h3>
        <button id="btn-close-modal" class="btn-close">&times;</button>
      </div>

      <form id="expense-form">
        <div class="form-group">
          <label class="form-label" for="expense-title">Title</label>
          <input type="text" id="expense-title" class="form-input" placeholder="e.g., Grocery Store" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="expense-amount">Amount ($)</label>
          <input type="number" id="expense-amount" class="form-input" placeholder="0.00" step="0.01" min="0.01" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="expense-category">Category</label>
          <select id="expense-category" class="form-select" required>
            <option value="Food">Food 🍔</option>
            <option value="Transport">Transport 🚗</option>
            <option value="Utilities">Utilities 💡</option>
            <option value="Entertainment">Entertainment 🎬</option>
            <option value="Health">Health 🏥</option>
            <option value="Shopping">Shopping 🛍️</option>
            <option value="Other">Other 📦</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="expense-date">Date</label>
          <input type="date" id="expense-date" class="form-input" required>
        </div>

        <div class="modal-actions">
          <button type="button" id="btn-cancel-modal" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Save Expense</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/app.js"></script>
</body>
</html>
